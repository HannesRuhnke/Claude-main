# Apache VirtualHost für Homelab Dashboard V3
# Speichern unter: /etc/apache2/sites-available/homelab-dashboard.conf

<VirtualHost *:80>
    ServerName homelab.local
    ServerAlias homelab
    ServerAdmin admin@homelab.local

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/homelab-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/homelab-dashboard-access.log combined
    LogLevel warn

    # Proxy-Settings
    ProxyPreserveHost On
    ProxyRequests Off

    # Backend Proxy
    ProxyPass / http://localhost:5000/
    ProxyPassReverse / http://localhost:5000/

    # WebSocket Support (für zukünftige Features)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://localhost:5000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://localhost:5000/$1 [P,L]

    # Header für Proxy
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # CORS Headers (optional)
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>

# SSL VirtualHost (empfohlen für Production)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName homelab.local
    ServerAlias homelab
    ServerAdmin admin@homelab.local

    # SSL-Zertifikat
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/homelab.crt
    SSLCertificateKeyFile /etc/ssl/private/homelab.key
    # Oder Let's Encrypt:
    # SSLCertificateFile /etc/letsencrypt/live/homelab.local/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/homelab.local/privkey.pem

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/homelab-dashboard-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/homelab-dashboard-ssl-access.log combined

    # Proxy-Settings
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://localhost:5000/
    ProxyPassReverse / http://localhost:5000/

    # WebSocket Support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://localhost:5000/$1 [P,L]

    # Header
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>
</IfModule>
