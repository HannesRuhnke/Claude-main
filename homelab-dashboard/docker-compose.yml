version: '3.8'

services:
  homelab-dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      # Persistente Datenbank
      - ./data/homelab.db:/app/homelab.db
      # Backups
      - ./data/backups:/app/backups
      # Screenshots
      - ./data/screenshots:/app/screenshots

    environment:
      # Flask-Konfiguration
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1

      # Optional: Custom Port
      # - PORT=5000

      # Optional: Secret Key (für Production)
      # - SECRET_KEY=dein-sehr-sicherer-secret-key

    # Health Check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/auth/check')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Ressourcen-Limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Netzwerk
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
